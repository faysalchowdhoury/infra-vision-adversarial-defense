[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-vision-adversarial-defense"
version = "1.0.0"
description = "Traffic-sign recognition under sensor corruption, stickers and adversarial patches: defences, integrity scores and a dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "torch>=2.2", "pillow>=10", "pydantic>=2.6,<3",
                "matplotlib>=3.8", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
visionguard = "visionguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
